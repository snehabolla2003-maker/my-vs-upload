<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Application form</legend>
    <form action="">
        <label for="uname">User Name</label>
        <input type="text" name="username" id="uname" placeholder="CAPITALS ONLY" required value="abc"><br><br>
        <label for="upass">Password</label>
        <input type="password" name="password" id="upass"><br><br>
        <label for="">contact no</label>
        <input type="tel" name="" id="" minlength="10" maxlength="10"><br><br>
        <label for="email">Email</label>
        <input type="email" name="" id="email"><br><br>
        <label for="">Gender:</label><br><br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female"><br><br>
        <label for="">Skills:</label><br><br>
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="html" checked disabled>
        <label for="css">CSS</label>
        <input type="checkbox" name="skills" id="css" checked>
        <label for="js">JS</label>
        <input type="checkbox" name="skills" id="js"><br><br>

        <label for="">Resume</label>
        <input type="file" name="" id="" accept=".pdf"><br><br>
        <label for="">Github</label>
        <input type="url" name="" id=""><br><br>
        <label for="">Joining date</label>
        <input type="date" name="" id="" min="2026-06-02" max="2026-06-20" ><br><br>
        <label for="">location</label>
        <select name="" id="">
            <option value="">Hyderabad</option>
            <option value="">Bangalore</option>
            <option value="">Mumbai</option>
        </select><br><br>
        <label for="">Branches</label>
        <select name="" id="">
        <optgroup label="hyderabad">
            <option value="">Gachibowli</option>
            <option value="">madhapur</option>
        </optgroup>
        <optgroup label="Bangalore">
            <option value="">BTM</option>
            <option value="">Vijanagar</option>
        </optgroup>
        <optgroup label="Mumbai">
            <option value="">pune</option>
            <option value="">kharadi</option>
        </optgroup>
        </select><br><br>
        <label for="">Select Technology</label>
        <input type="text" name="" list="tech">
        <datalist id="tech" >
            <option value="java">java</option>
            <option value="python">python</option>
            <option value="React">React</option>
        </datalist><br><br>
        <details open>
            <summary>More about JBIET</summary>
            <h4>Autonomous college</h4>
            <h4>100% placememnts</h4>
            <h4>nice labsetup</h4>
            <h4>extra ciricular activities</h4>
        </details><br><br>
        <label for="">Previous experience</label>
        <input type="range" name="" id="" step="10"><br><br>
        <label for="">salary</label>
        <input type="text" name="" id="" value="50000" readonly><br><br>
        <label for="">Address</label>
        <textarea name="" id=""></textarea><br><br>

        <input type="submit" name="" id="" >
        <input type="reset" name="" id="">
        <input type="color" name="" id="">

        <button>login</button>
    </form>
    </fieldset>
</body>
</html>
